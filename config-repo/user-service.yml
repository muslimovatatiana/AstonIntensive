server:
  port: 8081

app:
  scheduler:
    outbox-delay: ${OUTBOX_SCHEDULER_DELAY:30000}
  services:
    notification-url: "http://NOTIFICATION-SERVICE"

logging:
  level:
    root: INFO
    ru.aston.hometask4: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.kafka: INFO

resilience4j:
  circuitbreaker:
    instances:
      notificationServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
