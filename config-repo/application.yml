eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: "http://${EUREKA_HOST:localhost}:8761/eureka/"
  instance:
    prefer-ip-address: true

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
